name: EXT-01B registry publication review candidate
on:
  pull_request:
    paths: ['tools/review_publication.py', 'tests_publication/**', 'docs/PUBLICATION_REVIEW_EXT_01B.md', '.github/workflows/publication-review.yml']
permissions:
  contents: read
jobs:
  review-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OpenRGD/openrgd
          ref: 46fd178d2ccccdfb46f91d3cdafec1456dec5147
          path: .upstream/core
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify pin and no runtime or catalog changes
        run: |
          test "$(git -C .upstream/core rev-parse HEAD)" = 46fd178d2ccccdfb46f91d3cdafec1456dec5147
          git diff --exit-code 8c50645b6fbc73d73a87a278bf2009fa83f3705d HEAD -- registry rgd_registry
          git diff --check 8c50645b6fbc73d73a87a278bf2009fa83f3705d HEAD
      - name: Install test-only schema dependency
        run: python -m pip install jsonschema==4.23.0
      - name: Actual Core proposal and actual Registry read-only review
        env:
          PYTHONPATH: ${{ github.workspace }}/.upstream/core/contracts/module-publication/v0.1.0:${{ github.workspace }}
        run: |
          python -m unittest discover -s tests_publication -v
          python -O -m unittest discover -s tests_publication -v
          python -m tools.generate_index --check
