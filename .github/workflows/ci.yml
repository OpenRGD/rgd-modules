name: Registry CI
on:
  push:
  pull_request:

jobs:
  catalog-and-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate JSON
        run: |
          python3 -m json.tool registry/index.json > /dev/null
          python3 -m json.tool registry/modules/org.openrgd.calibration/0.2.0.json > /dev/null
          python3 -m json.tool registry/schemas/index.v0.1.schema.json > /dev/null
          python3 -m json.tool registry/schemas/module.v0.1.schema.json > /dev/null
      - name: Registry unit tests (offline, synthetic)
        run: python3 -m unittest discover -s tests -v
      - name: Discovery CLI smoke
        run: |
          python3 -m rgd_registry catalog > /tmp/catalog.json
          python3 - <<'PY'
          import json
          data = json.load(open("/tmp/catalog.json", encoding="utf-8"))
          assert data["registry_contract"] == "0.1.0-candidate"
          assert len(data["modules"]) == 1
          assert data["modules"][0]["id"] == "org.openrgd.calibration"
          assert data["modules"][0]["version"] == "0.2.0"
          PY

  pinned-install-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned Calibration source and build binary (explicit CI action)
        run: |
          python3 -m rgd_registry install org.openrgd.calibration --build --prefix "$RUNNER_TEMP/openrgd" > /tmp/install.json
          python3 -m rgd_registry resolve org.openrgd.calibration --prefix "$RUNNER_TEMP/openrgd" > /tmp/resolve.json
      - name: Invoke read-only Calibration inspection over synthetic fixture
        run: |
          "$RUNNER_TEMP/openrgd/modules/org.openrgd.calibration/0.2.0/bin/rgd-calibration" inspect \
            --bundle tests/fixtures/rgd-synthetic > /tmp/report.json
          python3 - <<'PY'
          import json
          installed = json.load(open("/tmp/install.json", encoding="utf-8"))
          resolved = json.load(open("/tmp/resolve.json", encoding="utf-8"))
          report = json.load(open("/tmp/report.json", encoding="utf-8"))
          assert installed["status"] == "ready"
          assert resolved["binary_sha256"] == installed["binary_sha256"]
          assert installed["source_commit"] == "81700401e2fa6d370a86b6c1f5a48802bc5f1fc7"
          assert report["model_id"] == "registry_ci_synthetic_robot"
          assert report["coverage"]["candidate_fields"] == 2
          assert report["current_robot_position_observed"] is False
          assert report["export_preview"] is None
          PY
